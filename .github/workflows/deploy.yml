name: 测试并部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    name: 部署到 Cloudflare
    needs: test
    # 只有 main 分支（推送或手动运行）才部署，Pull Request 只跑测试
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: 检查 Cloudflare 密钥
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=没有部署::仓库还没设置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID，这次跳过部署。设置方法见 README「部署到 Cloudflare」。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: 部署
        if: steps.check.outputs.ready == 'true'
        run: |
          # 第一次部署会自动创建 D1 数据库 nihongo-katsuyo，之后按名字找到同一个库；
          # 数据表由 Worker 在第一次请求时自动建好
          args=(deploy)
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            args+=(--var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID")
          else
            echo "::notice title=还没有 Google 登录::没有设置仓库变量 GOOGLE_CLIENT_ID。网站可以正常练习，但不能登录同步。"
          fi
          set -o pipefail
          npx wrangler "${args[@]}" 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -n "$url" ]; then
            echo "### 已部署：$url" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=已部署::$url"
          fi
