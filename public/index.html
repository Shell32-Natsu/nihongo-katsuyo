<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活用練習帳</title>
<meta name="robots" content="noindex">
<meta name="description" content="日语动词・形容词变形练习：按 JLPT N5–N1 分级，变形类型可自选，每题附规则讲解和错因诊断。">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b4796'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E6%B4%BB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 lang="ja">活用練習帳</h1>
      <p>日语动词・形容词变形练习 · 按 JLPT 分级</p>
    </div>
    <div class="score" id="score" aria-live="polite"></div>
  </header>

  <div class="account" id="account">
    <div class="acct-main"><div class="acct-text"><span class="acct-status busy"><span class="dot"></span><span>正在连接…</span></span></div></div>
  </div>

  <details class="setup" id="setup">
    <summary><span class="sum-label">练习设置</span><span class="sum-text" id="sumText"></span><span class="sum-caret" aria-hidden="true">▾</span></summary>
    <div class="setup-body">
      <div class="field">
        <h3>JLPT 级别<span class="tools"><button type="button" class="mini" data-all="levels">全选</button></span></h3>
        <div class="chips" id="levels"></div>
      </div>
      <div class="field">
        <h3>词类<span class="tools"><button type="button" class="mini" data-all="classes">全选</button></span></h3>
        <div class="chips" id="classes"></div>
      </div>
      <div class="field">
        <h3>动词变形<span class="tools"><button type="button" class="mini" data-all="vforms">全选</button><button type="button" class="mini" data-none="vforms">清空</button></span></h3>
        <div id="vforms"></div>
      </div>
      <div class="field">
        <h3>形容词变形<span class="tools"><button type="button" class="mini" data-all="aforms">全选</button><button type="button" class="mini" data-none="aforms">清空</button></span></h3>
        <div id="aforms"></div>
      </div>
      <div class="field">
        <h3>作答方式</h3>
        <div class="row">
          <div class="seg" role="radiogroup" aria-label="作答方式">
            <label><input type="radio" name="mode" id="mode-type" value="type"><span>打字</span></label>
            <label><input type="radio" name="mode" id="mode-choice" value="choice"><span>四选一</span></label>
          </div>
          <label class="toggle"><input type="checkbox" id="hint"> 题目上显示词类</label>
        </div>
      </div>
    </div>
  </details>

  <div class="due-banner" id="dueBanner" hidden></div>

  <main class="sheet" id="sheet" aria-live="polite"></main>

  <section class="panel" id="book" aria-labelledby="bookTitle">
    <div class="panel-head">
      <h2 id="bookTitle">单词本 <small>答错的词自动记进来，按间隔安排复习</small></h2>
      <button type="button" class="btn small" id="reviewBtn">开始复习</button>
    </div>
    <div class="counts" id="counts"></div>
    <div class="tabs" role="tablist" aria-label="单词本分类">
      <button type="button" class="tab" role="tab" id="tab-due" data-tab="due">待复习<small></small></button>
      <button type="button" class="tab" role="tab" id="tab-book" data-tab="book">单词本<small></small></button>
      <button type="button" class="tab" role="tab" id="tab-all" data-tab="all">全部单词<small></small></button>
    </div>
    <ul class="wlist" id="wlist" role="tabpanel"></ul>
    <button type="button" class="linkish" id="moreBtn" hidden>显示更多</button>
  </section>

  <section class="panel" aria-labelledby="ratesTitle">
    <h2 id="ratesTitle">各变形正确率 <small>累计，最弱的排在最上面</small></h2>
    <div class="rates" id="rates"></div>
    <div class="reset-row">
      <span class="muted" id="resetNote">清空后，统计、单词本和复习安排都会重新开始。</span>
      <button type="button" class="btn small warn" id="resetBtn">清空全部记录</button>
    </div>
  </section>
  <footer class="note">复习间隔：答错后 3 分钟再考一次，之后答对一次间隔就拉长（1 天、3 天、7 天、15 天、30 天），30 天那次也答对就算掌握。从没错过的词会越来越少出现。<br>打字题可以直接输入罗马字（如 kaeranai），会自动转成假名。按 Enter 判定、进入下一题。</footer>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/progress.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
