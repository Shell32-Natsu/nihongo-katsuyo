# Cloudflare Workers 配置：网页（public/）和同步接口（worker/）放在同一个 Worker 里，只对名单里的账号开放
name = "nihongo-katsuyo"
main = "worker/index.js"
compatibility_date = "2026-09-01"
# 部署时保留已经设置过的变量（GOOGLE_CLIENT_ID 和 ALLOWED_EMAILS 由 GitHub Actions 传入）
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# 每个请求都先经过 Worker 检查登录和名单，再决定给网页还是登录页
run_worker_first = true

# 首次部署时会自动创建这个 D1 数据库；数据表由 Worker 在第一次请求时自动建好
[[d1_databases]]
binding = "DB"
database_name = "nihongo-katsuyo"

[observability]
enabled = true
